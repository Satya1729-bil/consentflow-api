server:
  port: ${PORT:8080}
spring:
  application:
    name: consentflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/consentflow}
    username: ${DATABASE_USERNAME:consentflow}
    password: ${DATABASE_PASSWORD:local_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /docs
