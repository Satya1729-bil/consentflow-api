services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: consentflow
      POSTGRES_USER: consentflow
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - consentflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consentflow -d consentflow"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/consentflow
      DATABASE_USERNAME: consentflow
      DATABASE_PASSWORD: local_dev_password
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  consentflow_data: